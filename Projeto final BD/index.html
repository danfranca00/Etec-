<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja do Zé</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="pagina">
        <div class="card">
            <header class="card-cabecalho">
                <h1>Loja do Zé</h1>
                <p class="card-subtitulo">Gerencie a categoria de produtos</p>
            </header>
            <div class="card-corpo">
                <section class="secao-form">
                    <h2>Nova categoria</h2>
                    <form id="form-categoria" class="form-categoria">
                        <input type="text" id="descricao" placeholder="Ex: Brinquedos">
                        <div class="buttonDiv">
                            <button id="btnCadastrar" type="submit" class="btn btn-cadastrar">Cadastrar</button>
                            <button id="btnLimpar" type="reset" class="btn btn-limpar">Limpar</button>
                        </div>
                    </form>
                    <p id="mensagem"></p>
                </section>

                <section class="secao-lista">
                    <h2>Categorias</h2>
                    <ul id="lista-categorias"></ul>
                </section>

            </div>
            <!-- Para iniciar o projeto de npm Start -->
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
